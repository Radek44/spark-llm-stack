# Hermes provider config for spark-llm-stack
# Preferred path: Hermes -> LiteLLM localhost gateway -> local/cloud aliases.
# Add this provider to ~/.hermes/config.yaml after LiteLLM and vLLM are tested.
# Do not store API keys in this repo.

model:
  provider: local-litellm
  model: fast_local
  base_url: http://127.0.0.1:8180/v1

providers:
  local-litellm:
    api: http://127.0.0.1:8180/v1
    default_model: fast_local
    name: Local LiteLLM Router
    models:
    - fast_local
    - private_local
    # Optional future local routes:
    # - nemotron_local
    # - coder_local
    # Optional explicit cloud/API routes if configured in LiteLLM:
    # - code_frontier
    # - claude_frontier
    extra_body:
      max_tokens: 16384
      temperature: 0.7
      top_p: 0.95

  # Raw endpoint for debugging only. Prefer local-litellm above.
  raw-vllm-fast-local:
    api: http://127.0.0.1:8170/v1
    default_model: fast_local
    name: Raw vLLM Laguna S 2.1 NVFP4
    models:
    - fast_local
    - laguna-s-2.1-nvfp4
    extra_body:
      max_tokens: 16384
      temperature: 0.7
      top_p: 0.95
