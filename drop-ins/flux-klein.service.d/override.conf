# Revert: ./harden-llm-stack.sh --revert  (or rm this whole .d dir)

[Unit]
Conflicts=vllm-laguna-s21-nvfp4.service comfyui.service
StartLimitBurst=2
StartLimitIntervalSec=1800


[Service]
# Secondary CPU-memory containment; the launcher's host floor and sd-server's
# explicit GPU budget are the primary unified-memory protections.
MemoryHigh=12G
MemoryMax=16G
MemorySwapMax=0
OOMPolicy=stop
OOMScoreAdjust=200

# restart with a hard burst limit (3 fails in 10 min → systemd gives up)
Restart=no
RestartSec=15
RestartPreventExitStatus=75 78
