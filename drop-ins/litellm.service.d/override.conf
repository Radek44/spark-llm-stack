# managed-by:harden-llm-stack
# Generated template for LiteLLM routing gateway
# Revert: ./harden-llm-stack.sh --revert  (or rm this whole .d dir)

[Unit]
StartLimitBurst=3
StartLimitIntervalSec=600

[Service]
MemoryHigh=2G
MemoryMax=4G
MemorySwapMax=512M
OOMPolicy=stop
OOMScoreAdjust=100
Restart=on-failure
RestartSec=15
