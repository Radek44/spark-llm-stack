# Revert: ./harden-llm-stack.sh --revert  (or rm this whole .d dir)

[Unit]
Conflicts=vllm-laguna-s21-nvfp4.service sglang-qwen38-nvfp4.service flux-klein.service
StartLimitBurst=2
StartLimitIntervalSec=1800


[Service]
# GPU allocations can escape cgroup accounting on unified-memory systems.
# The launch wrapper and Comfy VRAM reservation are the primary safety guards.
MemoryHigh=76G
MemoryMax=84G
MemorySwapMax=0
OOMPolicy=stop
OOMScoreAdjust=200

Restart=no
RestartSec=15
RestartPreventExitStatus=75 78
