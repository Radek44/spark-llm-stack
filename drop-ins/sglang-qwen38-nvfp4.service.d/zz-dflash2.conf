# managed-by:claude / 2026-08-23 -- DFlash 2 speculative decoding
#
# A separate drop-in, not an edit to override.conf: that file is stamped
# managed-by:harden-llm-stack and is regenerated by that tool, so anything
# written there is lost on the next hardening run. Named zz- so it sorts last
# and its Environment= lines win over every earlier drop-in.
#
# Revert is this file: `rm` it, `systemctl --user daemon-reload`, restart. The
# base unit still carries the DSpark configuration untouched, and the previous
# image is still on disk.

[Unit]
Description=SGLang Qwen3.8-27B NVFP4 with DFlash 2 on 8171

[Service]
# The stock lmsysorg/sglang:qwen38-27b image predates DFlash 2. It registers
# DFlashDraftModel and DFlashLagunaForCausalLM only -- grepping it for
# "dflash2" returns nothing -- so the drafter's declared architecture,
# DFlash2DraftModel, hits "not a registered model" and the scheduler dies at
# load. This tag is purpose-built for exactly this pairing (published
# 2026-08-22, linux/arm64 present) and its registry resolves all three:
#   ['DFlashDraftModel', 'DFlashLagunaForCausalLM', 'DFlash2DraftModel']
# Verified before switching, not after.
Environment="SGLANG_IMAGE=lmsysorg/sglang:dev-qwen38-27b-dflash2"

# Block-diffusion drafter: one forward pass proposes a whole block and a
# selector traces the best coherent path through the candidates. Lossless --
# greedy output matches the target model token for token -- which is what makes
# this a safe swap rather than a quality trade. spec-bench asserts that by
# hashing every completion and comparing across drafters; it does not trust it.
Environment="DRAFT_MODEL_ID=incoai/Qwen3.8-27B-DFlash2"
Environment="DRAFT_MODEL_REVISION=dedf8df68adfb1afeaf7b7480c0a0243108177b4"

# MUST be set here. The base unit pins DRAFT_MODEL_ID to the DSpark drafter and
# does not set SPECULATIVE_ALGORITHM at all, so without this line the unit
# inherits the script's default and drives a DSpark drafter with the DFLASH
# algorithm -- a boot failure. Algorithm and drafter always move together.
Environment="SPECULATIVE_ALGORITHM=DFLASH"
Environment="SPECULATIVE_NUM_DRAFT_TOKENS=8"

# Stays at the base unit's 0.50, deliberately, despite the launcher script's
# default having moved to 0.40.
#
# DFLASH runs a separate draft runner with its own KV pool, and SGLang sizes
# the target runner's token capacity to fit BOTH pools in aggregate (see
# scale_kv_cell_size_per_token_for_dflash). At 0.40 with the cheaper DSpark
# drafter this host cleared the hard floor by 1.9% -- max_total_num_tokens
# 267213 against context_len 262144. DFlash 2 needs more than DSpark, so 0.40
# would very likely land under the floor and refuse to start.
#
# The memory 0.40 was meant to free also has no consumer today: the image and
# asset profiles are exclusive_gpu and arbitrated by the lock, so they cannot
# co-run with the LLM regardless of how much is free.
Environment="MEM_FRACTION_STATIC=0.50"

# Unsloth's corrected template for this model. The checkpoint's own template
# throws on inputs an agentic harness produces normally: `developer` role
# unhandled (falls through to the "System message must be at the beginning"
# raise), a second leading system message silently dropped, a hard
# raise_exception when multi_step_tool is set, and reasoning_effort='high' --
# the standard OpenAI value -- raising instead of mapping to xhigh.
# All four verified fixed against the live server, not assumed.
Environment="CHAT_TEMPLATE_HOST=%h/src/spark-llm-stack/config/qwen38-chat-template-unsloth.jinja"

# This image renamed the flag. The old name still parses here but logs a
# deprecation on every start; the new name does not exist on the older image,
# so the launcher defaults to the old one and the correct name is selected
# alongside the image, here.
Environment="MAMBA_STRATEGY_FLAG=--mamba-radix-cache-strategy"
