# managed-by:harden-llm-stack
# Generated template for Qwen3.8-27B NVFP4 on DGX Spark

[Unit]
Conflicts=vllm-laguna-s21-nvfp4.service flux-klein.service comfyui.service
StartLimitBurst=2
StartLimitIntervalSec=1800

[Service]
# Secondary CPU-memory containment. The container also carries its own
# --memory cap, and the launcher's host floor is the primary unified-memory
# guard, since GPU allocations escape cgroup accounting here.
MemoryHigh=100G
MemoryMax=108G
MemorySwapMax=0
OOMPolicy=stop
OOMScoreAdjust=200
Restart=no
RestartPreventExitStatus=75 78
